name: DevSecOps Pipeline

on:
  push:
    branches: [ "devsecops-pipeline" ]
  pull_request:
    branches: [ "main" ]

jobs:

  clonacion:
    name: "1. Clonación del repositorio"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Confirmar checkout
        run: |
          echo "Repositorio clonado correctamente"
          git log -1 --oneline

  sast:
    name: "2. SAST (SonarCloud)"
    needs: clonacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build y análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=rvillalobos182_pet-clinic \
            -Dsonar.organization=rvillalobos182 \
            -Dsonar.host.url=https://sonarcloud.io
      - name: Esperar procesamiento del análisis
        run: sleep 20
      - name: Verificar vulnerabilidades críticas/altas/medias
        run: |
          RESPONSE=$(curl -s "https://sonarcloud.io/api/issues/search?componentKeys=rvillalobos182_pet-clinic&types=VULNERABILITY&severities=BLOCKER,CRITICAL,MAJOR&resolved=false")
          echo "$RESPONSE"
          TOTAL=$(echo "$RESPONSE" | grep -o '"total":[0-9]*' | head -1 | grep -o '[0-9]*$')
          echo "Vulnerabilidades encontradas (critica/alta/media): $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            echo "SAST detecto $TOTAL vulnerabilidad(es). Deteniendo el pipeline."
            exit 1
          fi
          echo "SAST OK, sin vulnerabilidades bloqueantes."

  sca:
    name: "3. SCA (Dependency-Check)"
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'pet-clinic'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 4
            --enableRetired
      - name: Subir reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

docker_build:
    name: "4. Construcción imagen Docker"
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compilar proyecto (generar jar)
        run: mvn -B clean package -DskipTests
      - name: Copiar jar a la raíz para el Dockerfile
        run: cp target/*.jar ./spring-petclinic-2.6.0.jar
      - name: Build imagen
        run: docker build -t petclinic:${{ github.sha }} .
      - name: Guardar imagen para el siguiente job
        run: docker save petclinic:${{ github.sha }} -o /tmp/petclinic.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/petclinic.tar

  image_security:
    name: "5. Image Security (Trivy)"
    needs: docker_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Cargar imagen
        run: docker load -i /tmp/petclinic.tar
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'petclinic:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          ignore-unfixed: false